{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="mx-auto" style="max-width: 800px;">
        <h3 class="text-white mb-4">Search All Tasks</h3>
        
        <div class="mb-4">
            <input type="text" id="taskSearch" class="form-control form-control-lg bg-dark text-white border-secondary" placeholder="Type to search tasks..." autocomplete="off">
        </div>

        <div id="resultsList">
            {% for task in tasks %}
            <div class="feature-item mb-3 task-node" data-label="{{ task.label|lower }}">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">
                        <a href="{{ url_for('view_task', task_id=task.id) }}" class="text-white text-decoration-none">
                            {{ task.label }}
                        </a>
                    </h5>
                    <span class="badge bg-info text-dark">Due: {{ task.date_due.strftime('%Y-%m-%d') if task.date_due else 'No Date' }}</span>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
<script nonce="{{ csp_nonce() }}">
    document.getElementById('taskSearch').addEventListener('input', function(e) {
    const term = e.target.value.toLowerCase();
    const tasks = document.querySelectorAll('.task-node');
    
    tasks.forEach(task => {
        const label = task.getAttribute('data-label');
        if (label.includes(term)) {
            task.style.display = 'block';
        } else {
            task.style.display = 'none';
        }
    });
});
</script>
{% endblock %}
