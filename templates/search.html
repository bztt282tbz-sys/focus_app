{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="mx-auto" style="max-width: 800px;">
        <h3 class="text-white mb-4">Search All Tasks</h3>
        
        <div class="mb-4">
            <input type="text" id="taskSearch" class="form-control form-control-lg bg-dark text-white border-secondary" placeholder="Type to search tasks..." autocomplete="off">
        </div>

        <div id="resultsList">
            {% for task in tasks %}
            {# Remove data-label here because we will search the actual visible text #}
            <div class="feature-item mb-3 task-node">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">
                        <a href="{{ url_for('view_task', task_id=task.id) }}" class="text-white text-decoration-none decrypt-me is-decrypting">
                            {{ task.label }}
                        </a>
                    </h5>
                    <span class="badge bg-info text-dark">Due: {{ task.date_due.strftime('%Y-%m-%d') if task.date_due else 'No Date' }}</span>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
<script nonce="{{ csp_nonce() }}">
    // 1. Run the decryption first
    // This assumes your decryptPageContent() function is globally available in script.js
    document.addEventListener("DOMContentLoaded", async () => {
        await decryptPageContent(); 
        console.log("Search ready: Data decrypted.");
    });

    // 2. Updated Search Logic
    document.getElementById('taskSearch').addEventListener('input', function(e) {
        const term = e.target.value.toLowerCase();
        const taskNodes = document.querySelectorAll('.task-node');
        
        taskNodes.forEach(node => {
            // Find the decrypted link inside the node
            const labelElement = node.querySelector('.decrypt-me');
            const readableText = labelElement ? labelElement.innerText.toLowerCase() : "";
            
            if (readableText.includes(term)) {
                node.style.display = 'block';
            } else {
                node.style.display = 'none';
            }
        });
    });
</script>
{% endblock %}
