{% extends "base.html" %}
{% block content %}
<div class="card-apple mx-auto" style="max-width: 500px;">
    <h2 class="tracking-tight">Complete Your Profile</h2>
    <p class="text-muted">Set your public identity and security level.</p>
    
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Public Username</label>
            <input type="text" name="username" class="form-control" placeholder="e.g. AlexSmith" required>
        </div>
        
        <div class="mb-4">
            <label class="form-label">Security Preference</label>
            <select name="security_preference" class="form-control">
                <option value="Normal">Normal (Standard protection)</option>
                <option value="High">High (Strict verification required)</option>
            </select>
            <small class="text-muted">High security requires biometric re-auth for sensitive actions.</small>
        </div>
        
        <button type="submit" class="btn btn-dark w-100 py-2">Finish Setup</button>
    </form>
</div>
{% endblock %}
