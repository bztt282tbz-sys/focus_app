{% extends "base.html" %}
{% block content %}
<div class="card mx-auto" style="max-width: 500px;">
    <div class="card-body">
        <h2 class="card-title">Complete Your Profile</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Public Username</label>
                <input type="text" name="username" class="form-control" placeholder="e.g. AlexSmith" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Security Preference</label>
                <select name="security_preference" class="form-control">
                    <option value="Normal">Normal (Standard protection)<span class="badge text-bg-warning">INOP</span></option>
                    <option value="High">High (Strict verification required)<span class="badge text-bg-warning">INOP</span></option>
                </select>
            </div>
            <button type="submit" class="btn btn-dark w-100">Finish Setup</button>
        </form>
    </div>
</div>
{% endblock %}
