{% extends "base.html" %}
{% block content %}
<div class="centered-content py-4">
    <div class="card bg-dark text-white border-secondary mx-auto w-100" style="max-width: 600px;">
        <div class="card-body p-4">
            <h2 class="card-title mb-4">Add New Task</h2>
            
            <form method="POST" action="{{ url_for('new_task') }}">
                <div class="mb-3 text-start">
                    <label for="label" class="form-label text-light">Task Name</label>
                    <input type="text" id="label" name="label" class="form-control bg-dark text-white border-secondary" placeholder="What needs to be done?" maxlength="100" required>
                </div>

                <div class="mb-3 text-start">
                    <label for="comment" class="form-label text-light">Details (Optional)</label>
                    <textarea id="comment" name="comment" class="form-control bg-dark text-white border-secondary" rows="3" maxlength="280" placeholder="Add some context..."></textarea>
                </div>

                <div class="row mb-3 text-start">
                    <div class="col-md-6 mb-3 mb-md-0">
                        <label for="importance" class="form-label text-light">Importance (1-5)</label>
                        <select id="importance" name="importance" class="form-select bg-dark text-white border-secondary">
                            <option value="1">1 - Low</option>
                            <option value="2">2 - Normal</option>
                            <option value="3" selected>3 - Medium</option>
                            <option value="4">4 - High</option>
                            <option value="5">5 - Critical</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="complexity" class="form-label text-light">Complexity (1-5)</label>
                        <select id="complexity" name="complexity" class="form-select bg-dark text-white border-secondary">
                            <option value="1">1 - Trivial</option>
                            <option value="2" selected>2 - Easy</option>
                            <option value="3">3 - Moderate</option>
                            <option value="4">4 - Hard</option>
                            <option value="5">5 - Complex</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-4 text-start">
                    <div class="col-md-6 mb-3 mb-md-0">
                        <label for="date_start" class="form-label text-light">Start Date</label>
                        <input type="date" id="date_start" name="date_start" class="form-control bg-dark text-white border-secondary" required>
                    </div>
                    <div class="col-md-6">
                        <label for="date_due" class="form-label text-light">Due Date (Optional)</label>
                        <input type="date" id="date_due" name="date_due" class="form-control bg-dark text-white border-secondary">
                    </div>
                </div>

                <button type="submit" class="btn btn-lg custom-invert-btn w-100 fw-bold mt-2">Create Task</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
